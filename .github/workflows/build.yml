name: gh-build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  API_REVISION: 4b32862e3a797ad40a010c252b2d781c91bf36d2

concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Pin the Patrix-compatible converter and label the build
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          const name = "@modifiedcommand/convert-minecraft-java-texture-to-bedrock-api";
          const sha = process.env.API_REVISION;
          if (!/^[a-f0-9]{40}$/.test(sha) || !pkg.devDependencies[name]) {
            throw new Error("Missing pinned converter API revision or package");
          }
          pkg.devDependencies[name] = "github:TheOsmanYILDIRIM/ConvertJavaTextureToBedrockApi#" + sha;
          pkg.version = pkg.version.split("+")[0] + "+api." + sha.slice(0, 8);
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Verify fork bundle
        run: |
          test -f build/index.html
          grep -q "Java 26.3 conversions enabled" build/index.html
          grep -Fq -- "+api.${API_REVISION:0:8}" build/index.html
          grep -Fq -- "Nonstandard pack.mcmeta" build/worker.*.js
          worker_count="$(find build -maxdepth 1 -name 'worker.*.js' | wc -l)"
          test "$worker_count" -ge 1
          grep -Fq -- "overlay connection conditions cannot be baked unconditionally" build/worker.*.js
          grep -R -q "Custom Java block models detected" build/worker.*.js
          grep -R -q "j2b_companion/blocks/" build/worker.*.js
          grep -Fq -- "includeMaterialMapsSwitch" build/index.html
          grep -Fq -- "Conversion requested (worker)" build/worker.*.js
          ! grep -Fq -- "cells passed the edge check" build/worker.*.js
          echo "Verified Java 26.3 browser bundle and CTM material control."

      - uses: actions/upload-artifact@v4
        with:
          name: pages-build
          path: build
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to the web app repository's Pages site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the existing web app URL serves the new worker
        run: |
          set -euo pipefail
          url="https://theosmanyildirim.github.io/ConvertJavaTextureToBedrock/"
          expected="+api.${API_REVISION:0:8}"
          for attempt in {1..18}; do
            if curl -fsSL --max-time 10 -o /tmp/pages.html "${url}?build=${GITHUB_SHA}&attempt=${attempt}" &&
               grep -Fq -- "$expected" /tmp/pages.html; then
              while IFS= read -r entry; do
                if ! curl -fsSL --max-time 10 -o /tmp/entry.js "${url}${entry}"; then continue; fi
                while IFS= read -r worker; do
                  if curl -fsSL --max-time 15 -o /tmp/worker.js "${url}${worker}" &&
                     grep -Fq -- "Nonstandard pack.mcmeta" /tmp/worker.js; then
                    echo "Verified $expected and converter worker at $url"
                    exit 0
                  fi
                done < <(grep -oE 'worker\.[a-f0-9]+\.js' /tmp/entry.js | sort -u)
              done < <(grep -oE 'index\.[a-f0-9]+\.js' /tmp/pages.html | sort -u)
            fi
            sleep 5
          done
          echo "::error::Expected revision $expected and converter worker were not served at $url"
          exit 1
