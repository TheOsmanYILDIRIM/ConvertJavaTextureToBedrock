name: gh-build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Verify fork bundle
        run: |
          test -f build/index.html
          grep -q "Java 26.3 conversions enabled" build/index.html
          worker_count="$(find build -maxdepth 1 -name 'worker.*.js' | wc -l)"
          test "$worker_count" -ge 1
          grep -R -q "Custom Java block models detected" build/worker.*.js
          grep -R -q "j2b_companion/blocks/" build/worker.*.js
          echo "Verified Java 26.3 custom-block browser bundle."

      - uses: actions/upload-artifact@v4
        with:
          name: pages-build
          path: build
          if-no-files-found: error
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build
          clean: true

      - name: Verify live GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          url="https://theosmanyildirim.github.io/ConvertJavaTextureToBedrock/"
          for attempt in $(seq 1 15); do
            code="$(curl -L -sS -o /tmp/pages.html -w '%{http_code}' "$url" || true)"
            echo "attempt=$attempt http=$code url=$url"
            if [ "$code" = "200" ] && grep -q "Java 26.3 conversions enabled" /tmp/pages.html; then
              echo "Live Pages verified with Java 26.3 marker."
              exit 0
            fi
            sleep 4
          done
          echo "Live Pages verification failed."
          exit 1
